<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden 3 - 個人數位花園</title>
    <style>
        /* CSS 部分：保留了 Aogiri 的亮黃與水藍配色 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: #f8fcfd;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 導覽列 */
        header {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #00bfff;
            letter-spacing: 1px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-weight: 700;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #ff69b4;
        }

        #weather-widget {
            background-color: #fffacd;
            border: 2px solid #ffdb58;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #b8860b;
        }

        /* 頁面動畫 */
        .page-section {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .page-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hero 區塊 */
        .hero {
            background-color: #ffe600;
            min-height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            width: 200vw;
            height: 200vh;
            background-image: radial-gradient(#fff 15%, transparent 16%);
            background-size: 30px 30px;
            opacity: 0.15;
            animation: rotateBg 60s linear infinite;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hero-content { position: relative; z-index: 1; }
        .hero h1 { font-size: 4rem; color: #ff4500; text-shadow: 3px 3px 0 #fff; margin-bottom: 10px; }
        .hero p { font-size: 1.5rem; font-weight: bold; color: #333; }

        /* 部落格文章卡片 */
        .section-title { text-align: center; font-size: 2.2rem; margin-bottom: 40px; }
        .section-title span { display: block; font-size: 1rem; color: #ff69b4; letter-spacing: 5px; }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .blog-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            transition: transform 0.3s;
            cursor: pointer;
            border: 1px solid #eee;
        }

        .blog-card:hover { transform: translateY(-8px); }
        .blog-image { width: 100%; height: 180px; object-fit: cover; border-bottom: 4px solid #00bfff; }
        .blog-content { padding: 20px; }
        .blog-date { font-size: 0.8rem; background: #333; color: #fff; padding: 2px 8px; border-radius: 4px; }
        .blog-title { margin-top: 10px; font-size: 1.2rem; font-weight: 700; }

        footer { text-align: center; padding: 40px; background: #2c3e50; color: #bdc3c7; margin-top: 50px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">GARDEN 3</div>
        <nav>
            <ul id="nav-links">
                <li><a href="#" data-target="home" class="active">首頁</a></li>
                <li><a href="#" data-target="posts">文章紀錄</a></li>
                <li><a href="#" data-target="about">關於我</a></li>
                <li id="weather-widget">氣象載入中...</li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="page-section active">
            <div class="hero">
                <div class="hero-content">
                    <h1>Welcome to Garden 3</h1>
                    <p>種植創意與想法的數位花園</p>
                </div>
            </div>
            <div class="container">
                <h2 class="section-title"><span>RECENT</span> 最新動態</h2>
                <div id="blog-container" class="blog-grid"></div>
            </div>
        </section>

        <section id="posts" class="page-section">
            <div class="container">
                <h2 class="section-title"><span>ARCHIVE</span> 所有文章</h2>
                <p style="text-align:center;">這裡記錄了我的學習歷程與生活點滴。</p>
            </div>
        </section>

        <section id="about" class="page-section">
            <div class="container">
                <div class="about-content" style="background:#fff; padding:50px; border-radius:20px; text-align:center;">
                    <h2 class="section-title"><span>HELLO</span> 關於 Garden 3</h2>
                    <p>這是我個人的數位空間，我喜歡在這裡分享技術、設計與生活。</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Garden 3 Digital Lab. Built with Passion.</p>
    </footer>

    <script>
        // JS 部分：處理導覽、氣象 API 與模擬資料
        document.addEventListener('DOMContentLoaded', () => {
            initNavigation();
            fetchWeather();
            renderPosts();
        });

        function initNavigation() {
            const links = document.querySelectorAll('#nav-links a');
            const sections = document.querySelectorAll('.page-section');
            links.forEach(link => {
                link.addEventListener('click', e => {
                    e.preventDefault();
                    links.forEach(l => l.classList.remove('active'));
                    sections.forEach(s => s.classList.remove('active'));
                    link.classList.add('active');
                    document.getElementById(link.getAttribute('data-target')).classList.add('active');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        }

        async function fetchWeather() {
            const widget = document.getElementById('weather-text');
            try {
                const res = await fetch(`https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=CWA-B2F8E711-A528-4E4D-A8B9-6C869AF13550&locationName=臺北市`);
                const data = await res.json();
                const wx = data.records.location[0].weatherElement[0].time[0].parameter.parameterName;
                const temp = data.records.location[0].weatherElement[4].time[0].parameter.parameterName;
                document.getElementById('weather-widget').innerText = `臺北: ${wx} ${temp}°C`;
            } catch {
                document.getElementById('weather-widget').innerText = `天氣晴朗`;
            }
        }

        function renderPosts() {
            const container = document.getElementById('blog-container');
            const posts = [
                { title: 'Garden 3 專案正式啟動！', date: '2026.04.21', img: 'https://images.unsplash.com/photo-1453928582365-b6ad33cbcf64?w=500' },
                { title: '如何使用 Vercel 快速部署你的網站', date: '2026.04.15', img: 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=500' },
                { title: '從 HTML 基礎到現代前端框架', date: '2026.04.02', img: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=500' }
            ];
            posts.forEach(p => {
                const card = document.createElement('div');
                card.className = 'blog-card';
                card.innerHTML = `
                    <img src="${p.img}" class="blog-image">
                    <div class="blog-content">
                        <span class="blog-date">${p.date}</span>
                        <h3 class="blog-title">${p.title}</h3>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
